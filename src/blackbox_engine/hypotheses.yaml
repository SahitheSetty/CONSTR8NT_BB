# BLACK BOX diagnosis engine -- hypothesis priors and likelihood table.
#
# Likelihoods below are derived from the SCENARIOS fingerprints in mocks.py
# (one hand-reasoned expected symbol per probe per hypothesis, following the
# DNS -> routing -> TCP -> TLS -> HTTP chain from the handbook): each
# hypothesis's expected symbol on a probe gets that probe's `strength`
# (P(expected symbol | hypothesis)), every other symbol for that probe
# splits the remainder evenly. `strength` is a per-probe knob, tuned via
# evaluation.py's confusion matrix against StochasticMock (1800 simulated
# investigations, 150/hypothesis, seed=2): 86.9% overall accuracy, comfortably
# in the handbook's 85-92% target band. Deterministic protocol-state probes
# (tcp/tls/http) run high (0.83-0.92); noisy real-world measurements
# (latency/packet-loss buckets) run lower (~0.72). Weakest hypothesis:
# tls_failure (73.3%), mostly confused with client_local_issue -- both share
# tls_handshake="ok" on the ~9% of samples where tls_handshake noise flips
# away from tls_failure's true "expired_cert", which then wrongly unlocks
# the http_status probe (its precondition is satisfied by the noisy value,
# not the true one) and produces an internally-inconsistent combination
# StochasticMock's independent per-probe sampling can generate but a real
# collector never would. Second-weakest: waf_or_rate_limited (80.7%),
# confused with mtu_blackhole for the same reason on tls_handshake noise.
#
# Known simplification not yet hand-tuned: this treats every "wrong"
# symbol as equally implausible under a given hypothesis (a flat spread).
# The handbook's Annexure I calls out asymmetric evidence quality --
# e.g. a TCP `refused` is stronger, more specific evidence than `timeout`
# for some hypotheses -- which this table does not yet encode. Revisit
# per-symbol (not just per-probe) weighting if there's time before the
# feature freeze.
#
# likelihoods.<probe>.table[symbol][hypothesis] = P(observing `symbol` on
# `probe` | `hypothesis`). Each (probe, hypothesis) column -- i.e. summed
# across that probe's symbols -- must sum to 1.0. No probability may be
# 0.0 or 1.0; smoothed range [0.01, 0.99].

hypotheses:
  dns_failure:
    prior: 0.0833333333
    label: DNS resolution is failing for the target
    remediation: Check authoritative DNS records, zone file, and resolver configuration.
  auth_ns_down:
    prior: 0.0833333333
    label: The domain's authoritative nameserver is unreachable
    remediation: Contact the registrar/DNS host to check authoritative nameserver health and reachability.
  routing_blackhole:
    prior: 0.0833333333
    label: Network path silently drops traffic before reaching the destination
    remediation: Escalate to the network/transit provider; check for BGP null-routes or ACLs on intermediate
      ASes.
  path_change_degraded:
    prior: 0.0833333333
    label: A recent route change is causing degraded connectivity
    remediation: Compare current and baseline paths; work with the network team to revert or repair the
      new route.
  congestion_loss:
    prior: 0.0833333333
    label: Packet loss caused by congestion along the network path
    remediation: Check for capacity saturation on the path; consider QoS, traffic shaping, or a capacity
      upgrade.
  server_down:
    prior: 0.0833333333
    label: The destination server or service is down
    remediation: Check the server process and host health directly; restart the failed service.
  app_layer_error:
    prior: 0.0833333333
    label: Server is reachable but returning application-level errors
    remediation: Inspect application logs, recent deploys, and upstream dependency health.
  tls_failure:
    prior: 0.0833333333
    label: TLS handshake is failing
    remediation: Check certificate validity, chain completeness, and hostname/SNI configuration.
  waf_or_rate_limited:
    prior: 0.0833333333
    label: Requests are being blocked by a WAF or rate limiter
    remediation: Review WAF/rate-limit rules and allowlist the affected traffic if the block is unintended.
  local_vantage_bad:
    prior: 0.0833333333
    label: The diagnosis vantage point itself has a local network problem
    remediation: Re-run the investigation from a different vantage point/region to rule out a local issue.
  mtu_blackhole:
    prior: 0.0833333333
    label: Path MTU discovery is failing and large packets are being dropped
    remediation: Check PMTUD and ICMP filtering on the path; consider MSS clamping.
  client_local_issue:
    prior: 0.0833333333
    label: The issue is local to the requesting client, not the network path
    remediation: Check client-side firewall, proxy, VPN, and local DNS/hosts file configuration.
