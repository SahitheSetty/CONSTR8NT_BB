[project]
name = "blackbox-engine"
version = "0.1.0"
description = "BLACK BOX diagnosis engine — Bayesian sequential experimental design for network fault diagnosis"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyyaml",
    "rich",
    "pandas",
    "matplotlib",
]

[project.scripts]
blackbox = "blackbox_engine.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackbox_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
